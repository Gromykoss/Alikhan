name: gwt

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "openspec/specs/vor-import.md"
      - "bot/test_vor_reference.py"
      - "bot/vor_reference.py"
      - "bot/db.py"
      - "report/templates/**"
      - ".ci/scenario_map.yaml"
      - ".github/workflows/gwt.yml"

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest openpyxl
      - name: affected scenarios
        run: |
          # Pilot approximation: one commit per push, so HEAD~1 is the comparison base.
          CHANGED=$(git diff --name-only HEAD~1 HEAD || true)
          if [ -z "$CHANGED" ]; then
            AFFECTED=$(python3 .ci/run_affected.py --all)
          else
            AFFECTED=$(python3 .ci/run_affected.py --changed $CHANGED)
          fi
          echo "Affected: $AFFECTED"
          if [ -z "$AFFECTED" ]; then
            echo "No affected scenarios — nothing to run"
            exit 0
          fi
          pytest $AFFECTED -m scenario -q --maxfail=1
