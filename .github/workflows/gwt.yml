name: gwt

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "openspec/specs/vor-import.md"
      - "openspec/specs/qa-parser.md"
      - "openspec/specs/avr-generation.md"
      - "openspec/specs/ejo-generation.md"
      - "openspec/specs/data-ingestion.md"
      - "openspec/specs/document-extraction.md"
      - "openspec/specs/ojr-data-contract.md"
      - "openspec/specs/whatsapp-bridge.md"
      - "openspec/specs/agent-routing-safety.md"
      - "bot/test_vor_reference.py"
      - "bot/vor_reference.py"
      - "bot/db.py"
      - "bot/data_sources.py"
      - "bot/db_memory.py"
      - "bot/whatsapp_commands.py"
      - "bot/messaging.py"
      - "bot/authority.py"
      - "bot/config.py"
      - "bot/claim_gate.py"
      - "bot/authorized_senders.json"
      - "bot/document_extractor.py"
      - "docs/bridge_openapi.json"
      - "db/ojr_schema.sql"
      - "report/templates/**"
      - "bot/qa.py"
      - "bot/test_qa_parser.py"
      - "bot/tests/test_qa_golden.py"
      - "bot/tests/golden_qa_facts.json"
      - "bot/avr.py"
      - "bot/test_avr.py"
      - "bot/ejo_backfill.py"
      - "bot/fill_ejo.py"
      - "bot/update_template.py"
      - "bot/tests/test_ejo_template_contract.py"
      - "bot/test_ejo_backfill.py"
      - "bot/tests/fixtures/ejo_template_snapshot.xlsx"
      - ".ci/lint_gwt_cards.py"
      - ".ci/scenario_map.yaml"
      - ".ci/run_affected.py"
      - ".ci/check_scenario_map.py"
      - ".github/workflows/gwt.yml"
      - "pytest.ini"

jobs:
  lint-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: lint GWT cards
        run: python3 .ci/lint_gwt_cards.py openspec/specs --tests bot/test_vor_reference.py bot/test_qa_parser.py bot/tests/test_qa_golden.py bot/test_avr.py bot/tests/test_ejo_template_contract.py bot/test_ejo_backfill.py bot/tests/test_namedtuple_schemas.py bot/test_contracts.py bot/tests/test_bridge_contract.py

  completeness:
    needs: lint-cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: scenario map completeness
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No base resolved — completeness cannot run"
            exit 3
          fi
          python3 .ci/check_scenario_map.py --base "$BASE"

  scenarios:
    needs: completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest openpyxl psycopg2-binary jsonschema requests
      - name: affected scenarios
        run: |
          # Диапазон: push = before..HEAD; PR = base.sha..HEAD; fallback HEAD~1
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            AFFECTED=$(python3 .ci/run_affected.py --all)
          else
            # core.quotePath=false: кириллические пути (ВОР.xlsx) без octal-экранирования
            CHANGED=$(git -c core.quotePath=false diff --name-only "$BASE" HEAD || true)
            if [ -z "$CHANGED" ]; then
              AFFECTED=$(python3 .ci/run_affected.py --all)
            else
              AFFECTED=$(python3 .ci/run_affected.py --changed $CHANGED)
            fi
          fi
          echo "Affected: $AFFECTED"
          if [ -z "$AFFECTED" ]; then
            echo "No affected scenarios — nothing to run"
            exit 0
          fi
          ARGS=()
          while IFS= read -r t; do [ -n "$t" ] && ARGS+=("$t"); done <<< "$AFFECTED"
          pytest "${ARGS[@]}" -m scenario -q --maxfail=1
